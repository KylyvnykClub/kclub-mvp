name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Check Formatting
        run: bun run format

      - name: Run Linter
        run: bun run lint

      - name: Run Typecheck
        run: bun run typecheck

      - name: Run Tests
        run: bun run test

      - name: Run Contract Tests
        run: bun run test:contracts

      - name: Build Applications
        run: bun run build

  e2e:
    needs: validate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: true
      E2E_TEST_SECRET: e2e-test-secret-ci
      # NEXT_PUBLIC_* vars are inlined by Next.js at build time, even in server-only
      # code — playwright.config.ts's webServer.env override at *runtime* has no
      # effect on a pre-built (next build && next start) server, since this value
      # is already baked in by the "Build Applications" step below. Point it at the
      # E2E mock-supabase route from the start so the built server actually calls it.
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:3000/api/v1/test/mock-supabase
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
      SUPABASE_SERVICE_ROLE_KEY: dummy-service-role-key
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test
      ADMIN_JWT_SECRET: e2e-admin-jwt-secret-at-least-32-chars
      ADMIN_BOOTSTRAP_OWNER_PHONE: '+15551234567'
      ADMIN_STAFF_DEV_OTP: '000000'
      ADMIN_STAFF_DEV_TOTP: '123456'
      ADMIN_STAFF_ALLOWLIST_JSON: '[]'
      PRODUCT_CORE_URL: http://localhost:3000
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Browsers
        run: bunx playwright install --with-deps chromium

      - name: Prepare Test Database
        run: bun --filter @kclub/database db:migrate:deploy

      - name: Build Applications
        run: bun run build

      - name: Run E2E Tests
        run: bun run e2e

      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Test Results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14
